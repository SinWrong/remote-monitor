<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" role="img">
<title>远程屏幕监控架构</title>
<desc>Windows 采集端把屏幕画面经加密 WebSocket 推送到中转服务，中转服务再转发给浏览器观看端，控制指令反向回传。</desc>
<text x="40" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1f2328">整体架构</text>
<rect x="40" y="58" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="106" y="80" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#042C53">被监控电脑</text>
<text x="106" y="100" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">采集端 Agent</text>
<rect x="196" y="58" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="262" y="80" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#04342C">安全传输</text>
<text x="262" y="100" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">WebSocket / WSS</text>
<rect x="352" y="58" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="418" y="80" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#04342C">中转服务</text>
<text x="418" y="100" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">鉴权 · 内存转发</text>
<rect x="508" y="58" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="574" y="80" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#042C53">你的电脑</text>
<text x="574" y="100" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">浏览器观看端</text>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<path d="M176 86H190" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M332 86H346" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M488 86H502" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<text x="40" y="152" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#57606a">画面方向：采集端 → 中转服务 → 浏览器；控制方向：浏览器 → 中转服务 → 采集端</text>
<rect x="40" y="170" width="600" height="30" rx="8" fill="#F6F8FA" stroke="#d0d7de" stroke-width="1"/>
<text x="56" y="189" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#57606a">画面只在内存中转发，不落盘；公网部署时由 Caddy 等反向代理提供 HTTPS / WSS。</text>
</svg>
